<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="robots" content="noindex">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css?v2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="hero">
        <div class="hero__fotos" aria-hidden="true">
            <img class="hf hf--si-1" src="img/hero/bg-esquina-superior-izquierda-1.jpg" alt="">
            <img class="hf hf--si-2" src="img/hero/bg-esquina-superior-izquierda-2.jpg" alt="">

            <img class="hf hf--sd-1" src="img/hero/bg-esquina-superior-derecha-1.jpg" alt="">
            <img class="hf hf--sd-2" src="img/hero/bg-esquina-superior-derecha-2.jpg" alt="">
            <img class="hf hf--sd-3" src="img/hero/bg-esquina-superior-derecha-3.jpg" alt="">
            <img class="hf hf--sd-4" src="img/hero/bg-esquina-superior-derecha-4.jpg" alt="">

            <img class="hf hf--ii-1" src="img/hero/bg-esquina-inferior-izquierda-1.jpg" alt="">
            <img class="hf hf--ii-2" src="img/hero/bg-esquina-inferior-izquierda-2.jpg" alt="">
            <img class="hf hf--ii-3" src="img/hero/bg-esquina-inferior-izquierda-3.jpg" alt="">
            <img class="hf hf--ii-4" src="img/hero/bg-esquina-inferior-izquierda-4.jpg" alt="">
            <img class="hf hf--ii-5" src="img/hero/bg-esquina-inferior-izquierda-5.jpg" alt="">

            <img class="hf hf--id-1" src="img/hero/bg-esquina-inferior-derecha-1.jpg" alt="">
            <img class="hf hf--id-2" src="img/hero/bg-esquina-inferior-derecha-2.jpg" alt="">
            <img class="hf hf--id-3" src="img/hero/bg-esquina-inferior-derecha-3.jpg" alt="">
        </div>

        <div class="hero__contenido">
            <p>
                En memoria:
            </p>
            <h1 class="hero__titulo">
                Las despedidas<br>que marcaron 2026
            </h1>

            <button type="button" class="hero__flecha" aria-label="Ir al selector de meses">
                <img src="img/hero/icon-flecha-bajar.png" alt="">
            </button>

            <div class="hero__nav-meses">
                <img class="hero__selecciona" src="img/hero/icon-selecciona-mes.png" alt="Selecciona un mes">
                <nav id="nav-meses" class="nav-meses" aria-label="Selector de mes"></nav>
                <select id="nav-meses-movil" class="nav-meses-movil" aria-label="Selector de mes"></select>
            </div>
        </div>
    </header>

    <main id="meses"></main>

    <div class="main-footer">
        <div class="ctn-footer">
            <img src="./img/logo-comercio-footer.png" alt="el comercio" width="100%">
            <ul>
                <li>
                    <p>
                        <span>Textos:</span> Lorena Obregón
                    </p>
                </li>
                <li>
                    <p>
                        <span>Edición fotográfica:</span> Miriam Sánchez
                    </p>
                </li>
                <li>
                    <p>
                        <span>Realización:</span> Nuevas Narrativas EC
                    </p>
                </li>
            </ul>
        </div>
    </div>


    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
